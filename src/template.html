<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperManagement</title>
</head>
<body>
  <form id="form-project">
    <label for="titulo-projecto">
      Titulo
      <input id="title-project" type="text" name="titulo-projecto">
    </label>
    <label for="descripcion-projecto">
      Descripcion 
      <input id="description-project" type="textarea" name="descripcion-projecto">
    </label>
    <button id="btn-project"type="submit">enviar</button>
  </form>

  <div id="container">
    <div id="project-title-box"></div>
    <div id="project-description-box"></div>
    <div id="progress-bar"></div>
    <div id="container-task"></div>
  </div>
</body>
</html>
