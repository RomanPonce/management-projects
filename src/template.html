<!DOCTYPE html>

  <head>

    <title>SuperManagement</title>
  </head>

          <h2 id="project_title_box"></h2>

              Titulo

            <label for="descripcion-projecto">
              Descripcion
              <textarea id="form_project-description"></textarea>
              <!-- <input
                id="form_project-description"
                type="textarea"
                name="descripcion-projecto"
                required
              /> -->
            </label>
            <button id="form_project-btn" type="submit">enviar</button>
          </form>
          <nav>
            <ul id="project_container"></ul>
          </nav>
        </aside>
        <div id="container_task">
          
        </div>
      </div>
    </div>
  </body>
</html>
